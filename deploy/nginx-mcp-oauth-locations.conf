# Keep these four exact locations in the existing TLS server block in
# /etc/nginx/sites-available/mcp.edgedepth.com. Keep its current /mcp and
# /healthz locations unchanged. Exact matches also take precedence over the
# vhost's dot-file deny regex.

location = /.well-known/oauth-protected-resource {
    limit_req zone=mcp_rl burst=30 nodelay;
    proxy_pass http://edgedepth_mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/oauth-protected-resource/mcp {
    limit_req zone=mcp_rl burst=30 nodelay;
    proxy_pass http://edgedepth_mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/glama.json {
    limit_req zone=mcp_rl burst=30 nodelay;
    proxy_pass http://edgedepth_mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
