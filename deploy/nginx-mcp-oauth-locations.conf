# Add these two locations to the existing TLS server block in
# /etc/nginx/sites-enabled/mcp.edgedepth.com. Keep its current /mcp and
# /healthz locations unchanged.

location = /.well-known/oauth-protected-resource {
    limit_req zone=mcp_rl burst=30 nodelay;
    proxy_pass http://edgedepth_mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/oauth-protected-resource/mcp {
    limit_req zone=mcp_rl burst=30 nodelay;
    proxy_pass http://edgedepth_mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/glama.json {
    limit_req zone=mcp_rl burst=30 nodelay;
    proxy_pass http://edgedepth_mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /.well-known/openai-apps-challenge {
    limit_req zone=mcp_rl burst=30 nodelay;
    proxy_pass http://edgedepth_mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
